name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete. Cancelling it
# keeps queue time down on the free tier, which has a limited concurrency pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # The same image used locally, so a green CI run means the migration
        # was verified against the pgvector build it will actually meet.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fai
          POSTGRES_PASSWORD: fai
          POSTGRES_DB: fai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fai -d fai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: ci
      DATABASE_URL: postgresql://fai:fai@localhost:5432/fai
      JWT_SECRET_KEY: ci-only-secret-never-used-in-a-deployment

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Verify the migration matches the models
        # Guards against the most common schema bug: a model changed without a
        # matching revision, which passes tests locally and breaks the next
        # deployment.
        run: uv run alembic check

      - name: Verify the migration is reversible
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Test
        run: uv run pytest --cov=fai --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fai
          POSTGRES_PASSWORD: fai
          POSTGRES_DB: fai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fai -d fai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: ci
      DATABASE_URL: postgresql://fai:fai@localhost:5432/fai
      JWT_SECRET_KEY: ci-only-secret-never-used-in-a-deployment
      # The journey registers several accounts from one address. Registration
      # is limited to 5/hour in production, which is correct there and makes a
      # multi-test journey impossible here. The limits have their own backend
      # tests in tests/test_rate_limiting.py.
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Start the API
        working-directory: backend
        run: |
          uv run uvicorn fai.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 2
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build the frontend
        working-directory: frontend
        run: npm run build

      - name: Run end to end tests
        working-directory: frontend
        env:
          E2E_API_URL: http://127.0.0.1:8000
        run: npx playwright test

      - name: Upload the Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Audit Python dependencies
        working-directory: backend
        # Audits the resolved lockfile rather than the installed environment:
        # pip-audit cannot resolve the local editable project against PyPI, and
        # the lockfile is what a deployment installs.
        run: |
          uv export --format requirements-txt --no-emit-project --no-hashes --all-extras -o requirements-audit.txt
          uv run pip-audit --strict --desc -r requirements-audit.txt

      - name: Audit JavaScript dependencies
        working-directory: frontend
        # Production dependencies only. A vulnerability in a build-time tool
        # does not ship to a user, and failing the build on one would make the
        # signal noisy enough to be ignored.
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs history to scan commits, not just the tip.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
