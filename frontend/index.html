<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Ledgerline — AI financial reporting and audit intelligence</title>
    <meta
      name="description"
      content="Detect anomalies in financial statements with statistical and machine-learning checks, search filings semantically, and generate explained audit reports."
    />

    <!-- Open Graph, so a link shared into Slack or email renders as a card
         rather than a bare URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ledgerline — audit intelligence" />
    <meta
      property="og:description"
      content="Statistical detection first, AI explanation last. Reproducible findings for audit teams."
    />

    <!-- Fonts are preconnected because they are render-blocking; without this
         the browser waits for DNS and TLS before it can start the download. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
