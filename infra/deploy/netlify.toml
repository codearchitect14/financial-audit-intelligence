# Netlify configuration. An alternative to Vercel; use one or the other.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy the API so the browser sees a single origin, which keeps CORS out of
# the picture entirely.
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-WITH-YOUR-API-HOST/api/:splat"
  status = 200
  force = true

# SPA fallback. Without it, any deep link (/app/statements/<id>) returns the
# host's own 404 rather than reaching the router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Hashed asset filenames, so they can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
