[alembic]
script_location = alembic
prepend_sys_path = src
# Zero-padded, timestamped revision files sort chronologically in the
# directory listing, which matters once there are dozens of them.
file_template = %%(rev)s_%%(slug)s
version_path_separator = os
# The database URL is supplied by alembic/env.py from application settings,
# so that migrations and the application can never disagree about the target.
sqlalchemy.url =

[post_write_hooks]
# exec, not console_scripts: alembic resolves console_scripts entrypoints
# against its own installed distributions, which does not include ruff.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
