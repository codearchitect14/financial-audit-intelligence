[project]
name = "fai-backend"
version = "0.1.0"
description = "AI Financial Reporting and Audit Intelligence Platform - backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web layer
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",
    # Config and validation
    # [email] pulls email-validator, required by pydantic.EmailStr.
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Persistence. asyncpg drives the API; psycopg drives Alembic and batch scripts.
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    # Auth
    "pyjwt>=2.10.0",
    "passlib[argon2]>=1.7.4",
    # Analytics and ML (Phase 3)
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.0",
    # Embeddings (Phase 4). ONNX runtime, not torch: ~10x smaller install
    # so the API image fits inside free-tier memory limits.
    "fastembed>=0.4.0",
    # LLM providers (Phase 5) are called over plain REST
    "httpx>=0.27.0",
    # Reporting (Phase 6). WeasyPrint itself lives in the optional
    # "reports" extra because it needs native GTK/Pango libraries that
    # are present in the Linux image but awkward to install on Windows.
    "jinja2>=3.1.0",
    # Observability
    "structlog>=24.4.0",
]

[project.optional-dependencies]
reports = [
    "weasyprint>=63.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
    "types-passlib>=1.7.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI Depends() in argument defaults is the documented idiom
    "N811",  # aliasing SQLAlchemy type imports (UUID as PgUUID) is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires a live database"]
filterwarnings = [
    "error::RuntimeWarning",
    # passlib reads argon2-cffi's __version__, which that package has
    # deprecated. Nothing actionable here until passlib releases a fix.
    "ignore:Accessing argon2.__version__:DeprecationWarning",
]
